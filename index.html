<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>提示词与视频 · 觉哥学习库</title>
  <meta name="description" content="浏览视频案例，查看并复制完整中文提示词。">
  <link rel="stylesheet" href="/style.css?v=6">
  <script src="/app.js?v=5" defer></script>
</head>
<body>
  <header>
    <div class="brand"><span class="mark">P</span><div><strong>提示词与视频</strong><small>真实案例学习库</small></div></div>
    <nav class="siteNav"><a class="active" href="/">视频提示词</a><a href="/images.html?v=2">图片提示词</a></nav>
    <div class="count"><b id="accepted">—</b><span>条已验收案例</span></div>
  </header>
  <main>
    <section class="intro">
      <p class="eyebrow">PROMPT LIBRARY</p>
      <h1>看视频，学完整提示词。</h1>
      <p>点击封面直接播放；点击卡片上的按钮，查看并复制完整中文提示词。</p>
    </section>
    <section class="toolbar" aria-label="筛选案例">
      <label class="search"><span>搜索</span><input id="search" type="search" placeholder="搜索标题、提示词、风格或模型" autocomplete="off"></label>
      <label><span>类别</span><select id="category"><option value="">全部类别</option></select></label>
      <label><span>模型</span><select id="model"><option value="">全部模型</option></select></label>
      <label><span>时长</span><select id="duration"><option value="">全部时长</option><option value="under10">不足 10 秒</option><option value="10to20">10–19.9 秒</option><option value="20to30">20–29.9 秒</option><option value="30plus">30 秒及以上</option></select></label>
    </section>
    <nav class="assetFilters" aria-label="参考素材筛选"><button type="button" data-asset="" class="selected">全部案例</button><button type="button" data-asset="images">有参考图 <b id="imageCases">—</b></button><button type="button" data-asset="missing">缺少参考素材 <b id="missingCases">—</b></button></nav>
    <div class="resultline"><strong id="resultCount">正在加载…</strong><button id="clear" type="button">清除筛选</button></div>
    <section id="grid" class="grid" aria-live="polite"></section>
    <nav class="pagination" aria-label="翻页"><button id="prev" type="button">上一页</button><span id="pageText"></span><button id="next" type="button">下一页</button></nav>
  </main>
  <aside id="promptFloat" class="promptFloat" aria-label="完整中文提示词" hidden>
    <div class="promptFloatHead"><strong>完整中文提示词</strong><button id="closePrompt" type="button" aria-label="关闭提示词">×</button></div>
    <p id="promptText"></p>
    <div id="promptImages" class="promptImages" hidden><strong>原始输入图</strong><div id="promptImageList"></div></div>
    <p id="assetStatus" class="assetStatus"></p>
    <div class="promptActions"><button id="copyPrompt" class="copyPrompt" type="button">复制完整提示词</button><button id="downloadPack" class="downloadPack" type="button">下载资料</button></div>
  </aside>
</body>
</html>
